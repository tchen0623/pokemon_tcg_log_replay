<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTCGL Replay+ — 宝可梦 Live 对战回放</title>
<meta name="description" content="把 Pokémon TCG Live 的战斗日志变成可逐帧复盘的完整回放：剩余血量、能量附着、主视角明牌、放逐区、对局统计。纯浏览器本地解析，日志不上传。">
<meta property="og:title" content="PTCGL Replay+ — 宝可梦 Live 对战回放">
<meta property="og:description" content="导入 battle log，逐帧复盘整局对战：血量/能量/手牌/放逐区全还原。纯本地解析，隐私安全。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tchen0623.github.io/pokemon_tcg_log_replay/">
<meta property="og:image" content="https://tchen0623.github.io/pokemon_tcg_log_replay/assets/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="loadbar"><div id="loadbar-fill"></div><span id="loadbar-text"></span></div>
<div id="app">
  <header>
    <div class="logo">PTCGL <span>Replay+</span></div>
    <div class="sub">战斗日志 → 可视化回放 · 本地解析 · 血量/能量全还原</div>
    <span class="badge ok" id="parse-badge" style="display:none"></span>
    <span class="badge warn" id="raw-badge" style="display:none"></span>
    <div class="spacer"></div>
    <button id="btn-decklist">📋 卡组清单</button>
    <button id="btn-stats">📊 对局统计</button>
    <button id="btn-paste">📋 粘贴日志</button>
    <button class="primary" id="btn-file">📁 导入日志</button>
    <input type="file" id="file-input" accept=".txt" hidden>
  </header>

  <div id="stage">
    <div id="board-wrap">
      <div id="gameover"></div>
      <div id="board"></div>
      <div id="center-band"></div>
    </div>
    <div id="log-wrap">
      <div id="log-head"><h2>Action Log</h2><span class="sub" id="log-count"></span></div>
      <div id="log"></div>
    </div>
  </div>

  <div id="controls">
    <button id="ctl-start" title="Home">⏮</button>
    <button id="ctl-prev" title="←">◀</button>
    <button class="primary" id="ctl-play" title="Space">▶</button>
    <button id="ctl-next" title="→">▶</button>
    <button id="ctl-end" title="End">⏭</button>
    <button id="ctl-turn-prev" title="Shift+←">⏪ 回合</button>
    <button id="ctl-turn-next" title="Shift+→">回合 ⏩</button>
    <input type="range" id="scrub" min="0" max="0" value="0">
    <div class="pos" id="pos">0 / 0</div>
    <div class="speeds" id="speeds"></div>
  </div>
</div>

<!-- modals -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <button class="close ghost" id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="tooltip"></div>

<div id="welcome">
  <div class="modal" style="text-align:center">
    <h3 style="font-size:20px">PTCGL <span style="color:var(--accent)">Replay+</span></h3>
    <p style="color:var(--dim);margin:10px 0 20px">把 Pokémon TCG Live 的战斗日志变成可拖拽、可逐帧复盘的完整回放。<br>解析全程在本地浏览器完成。</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="primary" id="w-demo">观看演示对局 →</button>
      <button id="w-file">导入日志文件</button>
      <button id="w-paste">粘贴日志</button>
    </div>
    <p style="color:var(--dim);font-size:11px;margin-top:22px;line-height:1.7">
      🔒 纯静态网站 · 解析 100% 在你的浏览器本地完成 · 日志不经过任何服务器<br>
      卡牌数据来自 <a href="https://tcgdex.dev" target="_blank" rel="noopener" style="color:var(--accent)">TCGdex</a> · 本项目为玩家工具，与 The Pokémon Company 无关
    </p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
